<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vice and Virtue</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #241710;
        color: #ffefc5;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
        color: #e3b510;
      }
      p {
        opacity: 0.85;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #e3b510;
        color: #241710;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.7rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.07);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Can't reach Vice &amp; Virtue</h1>
      <p>
        We couldn't connect to the game servers. Check your internet connection
        and try again.
      </p>
      <button onclick="window.vvDesktop && window.vvDesktop.retry()">
        Retry
      </button>
    </div>
  </body>
</html>
